<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lógica de Progração com Javascript</title>
</head>
<body>
    <H1>Lógica de Programação com Javascript</H1>
    <p>Meu primeiro Projeto utilizando VS Code,Git e Github.</p>
    <section>
        <!---criando á área da pagina para testar o primeiro exemplo de Javascript-->
        <h2>1- Variáveís, tipos e saída </h2>

        <!--O botão possui o evento "onclick". Quando o usuário clicar no botão, o navegador irá procurar uma função chamada: exVariaveis() 
        Portanto: 
        BOTÃO 
        ↓ 
        onclick 
        ↓ 
        exVariaveis() 
        ↓ 
        executa o código da função-->

        <button onclick="exVariaveis()">
            rodar exemplo
        </button>

        <!--Este <div> será utilizado para mostrar o resultado na própria página.
             Ele possui o ID: resultado Esse ID será localizado pelo JavaScript através de: document.getElementById("resultado")-->

        <div id="resultado"></div>

    </section>

    <!--javascript esta em "inline"-->
    <script>

        /*function" cria uma função. A função é um bloco de código que só será executado quando for chamado. Neste exemplo: function exVariaveis() cria a função chamada "exVariaveis".
         O botão chama essa função através de: onclick="exVariaveis()"
          Portanto: BOTÃO ↓ 
          exVariaveis() ↓
           código da função */
        function exVariaveis() { 
            /* "const" cria uma variável cujo valor não será reatribuído posteriormente. Aqui: nome = "Lucas" "nome" é o nome da variável. "Lucas" é o valor armazenado nela. Tipo do valor: string String representa texto. */
            const nome = "Lucas";
            let idade = 29;
            const estudante = true;

            idade = idade + 1;

            const mensagem = `Nome: ${nome}
            Idade: ${idade}
            Estudante: ${estudante}`;

            document.getElementById("resultado").textContent = mensagem;
            console.log("Nome:",nome);
            console.log("Idade:",idade);
            console.log("Estudante:",estudante);
        }
    </script>
</body>
</html>
