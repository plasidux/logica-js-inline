<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lógica de Progração com Javascript</title>
</head>
<body>
    <H1>Lógica de Programação com Javascript</H1>
    <p>Meu primeiro Projeto utilizando VS Code,Git e Github.</p>
    <section>

        <!---criando á área da pagina para testar o primeiro exemplo de Javascript-->
        <h2>1 - Variáveís, tipos e saída </h2>

        <!--executa o bloco de função exVariaveis-->
        <button onclick="exVariaveis()">
            Executar exemplo
        </button>

        <!--Este <div> será utilizado para mostrar o resultado na própria página.
             Ele possui o ID: resultado Esse ID será localizado pelo JavaScript através de: document.getElementById("resultado")-->

        <div id="resultado"></div>

    </section>

    <section>
        <!---->
        <h2>2 - Entrada e Saída</h2>

        <!--execulta a fução entradasaida-->
        <button onclick="entradasaida()">
            Executar exemplo
        </button>

    </section>

    <!--javascript esta em "inline"-->
    <script>

       /* função e variáveis */
        function exVariaveis() {   

            /*const- nao pode ser reatribuida */
            const nome = "Lucas";
            const estudante = true;
            /*let- permite que a variavel possa ser reatribuida */
            let idade = 29;

            /*reatributo - let */
            idade = idade + 1;

            /* As crases permitem inserir variáveis
                dentro do texto utilizando:${} */
            const mensagem = `Nome: ${nome}
            Idade: ${idade}
            Estudante: ${estudante}`;

            /* Localiza o elemento que possui:id="resultado" e coloca a mensagem dentro dele */
            document.getElementById("resultado").textContent = mensagem;

            /* Exibe os valores no Console do navegador*/
            console.log("Nome:",nome);
            console.log("Idade:",idade);
            console.log("Estudante:",estudante);
        }

        /*entrada e saída*/
        function entradasaida() {

            /*prompt solicita uma informmaçõa ao usuario. O valor sera armazenado na variável "nome"*/
            const nome = prompt("Digite seu nome:");
            const idade = prompt("Digite usa idade:");
            /*alert() apresenta uma mensagempara o usuário.*/
            alert(`ola, ${nome}! seja bem-vindo.`);
            alert(`idade: ${idade}.`);
        }
    </script>
</body>
</html>
